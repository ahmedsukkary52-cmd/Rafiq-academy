name: rafiq_academy
description: "أكاديمية رفيق لتحفيظ القرآن الكريم"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ---- State Management (Bloc) ----
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  bloc_concurrency: ^0.2.5

  # ---- Dependency Injection ----
  get_it: ^9.2.1
  injectable: ^2.4.4

  # ---- Routing ----
  go_router: ^14.2.0

  # ---- Firebase ----
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  cloud_functions: ^5.6.2

  # ---- Functional error handling (Either<Failure, Success>) ----
  fpdart: ^1.1.0

  # ---- Immutable Models / Entities ----
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ---- تشغيل تسميع الآيات ----
  just_audio: ^0.9.40

  # ---- فحص الاتصال بالإنترنت ----
  internet_connection_checker_plus: ^2.5.1

  # ---- خطوط عربية ----
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  injectable_generator: ^2.12.1

flutter:
  uses-material-design: true