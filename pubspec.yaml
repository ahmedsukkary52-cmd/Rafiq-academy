name: rafiq_academy
description: "أكاديمية بصمة لتحفيظ القرآن الكريم"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- State Management (Bloc) ----
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  bloc_concurrency: ^0.2.5

  # ---- Dependency Injection ----
  get_it: ^9.2.1
  injectable: ^2.4.4

  # ---- Routing ----
  go_router: ^14.2.0

  # ---- Firebase ----
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  cloud_functions: ^5.6.2

  # ---- Functional error handling (Either<Failure, Success>) ----
  fpdart: ^1.1.0

  # ---- Immutable Models / Entities ----
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ---- تشغيل تسميع الآيات ----
  just_audio: ^0.9.40

  # ---- تقويم أكاديمي ----
  table_calendar: ^3.2.0
  hijri: ^3.0.0

  # ---- Charts ----
  fl_chart: ^0.70.2

  # ---- توليد وطباعة شهادات PDF ----
  pdf: ^3.11.1
  printing: ^5.13.1

  # ---- فحص الاتصال بالإنترنت ----
  internet_connection_checker_plus: ^2.5.1

  # ---- تخزين تفضيلات محلية (أونبوردنج/إعدادات) ----
  shared_preferences: ^2.3.2

  # ---- خطوط عربية ----
  google_fonts: ^6.2.1

  # ---- تسجيل الصوت ----
  path_provider: ^2.1.2

  cupertino_icons: ^1.0.8
  record: ^6.2.1
  
  # ---- File Handling
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  flutter_local_notifications: ^22.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  injectable_generator: ^2.12.1

flutter:
  # Android builds without --flavor use dev (rafiq-academy); prod is explicit
  # only. iOS flavor schemes are deferred to B9.
  default-flavor: dev
  uses-material-design: true
  assets:
    - assets/branding/academy_logo.png
    - assets/data/audio_durations.json
    # Report PDFs embed these (SIL OFL 1.1, see NotoNaskhArabic-OFL.txt);
    # bundled so PDF export never needs a font download.
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/NotoNaskhArabic-Bold.ttf
    - assets/fonts/NotoNaskhArabic-OFL.txt
    - assets/fonts/Cairo-OFL.txt
  # App typography (SIL OFL 1.1, see Cairo-OFL.txt): the exact static files
  # google_fonts would download. Their names match google_fonts' asset lookup,
  # so the remaining GoogleFonts.cairo call sites load these too.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900